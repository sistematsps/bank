<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Depósitos - Master</title>

    <link rel="stylesheet" href="./master.css">

    <style>
        .pagina {
            padding: 25px;
        }

        .cabecalho-pagina {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .cabecalho-pagina h1 {
            margin: 0;
        }

        .cabecalho-pagina p {
            margin-top: 6px;
            color: #6b7280;
        }

        .btn-voltar {
            border: 0;
            background: #374151;
            color: white;
            padding: 11px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .filtros {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .filtros input,
        .filtros select {
            width: 100%;
            max-width: 450px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .resumo-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .resumo-card span {
            display: block;
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .resumo-card strong {
            font-size: 24px;
        }

        .tabela-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            font-size: 13px;
            color: #4b5563;
        }

        td {
            font-size: 14px;
        }

        .usuario {
            font-weight: bold;
        }

        .email {
            color: #6b7280;
            font-size: 12px;
            margin-top: 3px;
        }

        .valor {
            font-weight: bold;
            font-size: 16px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pendente {
            background: #fef3c7;
            color: #92400e;
        }

        .aprovado {
            background: #dcfce7;
            color: #166534;
        }

        .rejeitado {
            background: #fee2e2;
            color: #991b1b;
        }

        .acoes {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .btn {
            border: 0;
            padding: 8px 11px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-aprovar {
            background: #16a34a;
            color: white;
        }

        .btn-aprovar:hover {
            background: #15803d;
        }

        .btn-rejeitar {
            background: #dc2626;
            color: white;
        }

        .btn-rejeitar:hover {
            background: #b91c1c;
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .carregando,
        .vazio,
        .erro {
            padding: 35px;
            text-align: center;
        }

        .carregando,
        .vazio {
            color: #6b7280;
        }

        .erro {
            color: #991b1b;
        }

        .mensagem {
            display: none;
            padding: 13px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .mensagem.sucesso {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .mensagem.erro {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 800px) {
            .pagina {
                padding: 15px;
            }

            .resumo {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="pagina">

    <div class="cabecalho-pagina">

        <div>
            <h1>💰 Depósitos</h1>
            <p>Gerenciamento das solicitações de depósito.</p>
        </div>

        <button
            class="btn-voltar"
            id="btnVoltar"
        >
            ← Voltar ao Dashboard
        </button>

    </div>


    <div id="mensagem" class="mensagem"></div>


    <div class="resumo">

        <div class="resumo-card">
            <span>Total de solicitações</span>
            <strong id="totalDepositos">0</strong>
        </div>

        <div class="resumo-card">
            <span>Depósitos pendentes</span>
            <strong id="totalPendentes">0</strong>
        </div>

        <div class="resumo-card">
            <span>Valor pendente</span>
            <strong id="valorPendente">R$ 0,00</strong>
        </div>

    </div>


    <div class="filtros">

        <input
            type="text"
            id="busca"
            placeholder="Pesquisar por nome, e-mail ou telefone..."
        >

        <br><br>

        <select id="filtroStatus">

            <option value="todos">
                Todos os status
            </option>

            <option value="pendente">
                Pendentes
            </option>

            <option value="aprovado">
                Aprovados
            </option>

            <option value="rejeitado">
                Rejeitados
            </option>

        </select>

    </div>


    <div class="tabela-container">

        <div id="conteudo">
            <div class="carregando">
                Carregando depósitos...
            </div>
        </div>

    </div>

</div>


<script type="module">

    import {
        auth,
        db
    } from "../js/firebase.js";


    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        collection,
        getDocs,
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    const conteudo =
        document.getElementById("conteudo");

    const busca =
        document.getElementById("busca");

    const filtroStatus =
        document.getElementById("filtroStatus");

    const totalDepositos =
        document.getElementById("totalDepositos");

    const totalPendentes =
        document.getElementById("totalPendentes");

    const valorPendente =
        document.getElementById("valorPendente");

    const mensagem =
        document.getElementById("mensagem");


    let depositos = [];
    let usuarios = {};

    let masterAutorizado = false;


    // ==========================================
    // MOEDA
    // ==========================================

    function moeda(valor) {

        return Number(valor || 0).toLocaleString(
            "pt-BR",
            {
                style: "currency",
                currency: "BRL"
            }
        );

    }


    // ==========================================
    // DATA
    // ==========================================

    function dataFormatada(timestamp) {

        if (!timestamp) {
            return "Aguardando data";
        }

        try {

            return timestamp.toDate().toLocaleString(
                "pt-BR"
            );

        } catch {

            return "Data indisponível";

        }

    }


    // ==========================================
    // ESCAPAR HTML
    // ==========================================

    function escapar(texto) {

        return String(texto || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // MENSAGEM
    // ==========================================

    function mostrarMensagem(texto, tipo) {

        mensagem.textContent = texto;

        mensagem.className =
            "mensagem " + tipo;

    }


    // ==========================================
    // VERIFICAR MASTER
    // ==========================================

    async function verificarMaster(user) {

        const ref =
            doc(db, "usuarios", user.uid);

        const snap =
            await getDoc(ref);


        if (!snap.exists()) {

            return false;

        }


        const dados = snap.data();

        return dados.tipo === "master";

    }


    // ==========================================
    // CARREGAR USUÁRIOS
    // ==========================================

    async function carregarUsuarios() {

        const snapshot =
            await getDocs(
                collection(db, "usuarios")
            );


        usuarios = {};


        snapshot.forEach((item) => {

            usuarios[item.id] =
                item.data();

        });

    }


    // ==========================================
    // CARREGAR DEPÓSITOS
    // ==========================================

    async function carregarDepositos() {

        conteudo.innerHTML = `
            <div class="carregando">
                Carregando depósitos...
            </div>
        `;


        const snapshot =
            await getDocs(
                collection(db, "depositos")
            );


        depositos = [];


        snapshot.forEach((item) => {

            depositos.push({
                id: item.id,
                ...item.data()
            });

        });


        depositos.sort((a, b) => {

            const dataA =
                a.criadoEm?.toMillis?.() || 0;

            const dataB =
                b.criadoEm?.toMillis?.() || 0;

            return dataB - dataA;

        });


        atualizarResumo();

        renderizar();

    }


    // ==========================================
    // RESUMO
    // ==========================================

    function atualizarResumo() {

        const pendentes =
            depositos.filter(
                item => item.status === "pendente"
            );


        const valor =
            pendentes.reduce(
                (total, item) =>
                    total + Number(item.valor || 0),
                0
            );


        totalDepositos.textContent =
            depositos.length;


        totalPendentes.textContent =
            pendentes.length;


        valorPendente.textContent =
            moeda(valor);

    }


    // ==========================================
    // RENDERIZAR
    // ==========================================

    function renderizar() {

        const textoBusca =
            busca.value
                .trim()
                .toLowerCase();


        const statusSelecionado =
            filtroStatus.value;


        const filtrados =
            depositos.filter((deposito) => {

                const usuario =
                    usuarios[deposito.usuarioId] || {};


                const texto =
                    (
                        (usuario.nome || "") +
                        " " +
                        (usuario.email || "") +
                        " " +
                        (usuario.telefone || "")
                    ).toLowerCase();


                const correspondeBusca =
                    !textoBusca ||
                    texto.includes(textoBusca);


                const correspondeStatus =
                    statusSelecionado === "todos" ||
                    deposito.status === statusSelecionado;


                return (
                    correspondeBusca &&
                    correspondeStatus
                );

            });


        if (!filtrados.length) {

            conteudo.innerHTML = `
                <div class="vazio">
                    Nenhum depósito encontrado.
                </div>
            `;

            return;

        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>Usuário</th>

                        <th>Valor</th>

                        <th>Data</th>

                        <th>Status</th>

                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody>

        `;


        filtrados.forEach((deposito) => {

            const usuario =
                usuarios[deposito.usuarioId] || {};


            const status =
                deposito.status || "pendente";


            let classe =
                "pendente";

            let textoStatus =
                "Pendente";


            if (status === "aprovado") {

                classe = "aprovado";

                textoStatus = "Aprovado";

            }


            if (status === "rejeitado") {

                classe = "rejeitado";

                textoStatus = "Rejeitado";

            }


            const podeAgir =
                status === "pendente";


            html += `

                <tr>

                    <td>

                        <div class="usuario">
                            ${escapar(
                                usuario.nome ||
                                "Usuário não encontrado"
                            )}
                        </div>

                        <div class="email">
                            ${escapar(
                                usuario.email ||
                                ""
                            )}
                        </div>

                    </td>


                    <td>

                        <div class="valor">
                            ${moeda(deposito.valor)}
                        </div>

                    </td>


                    <td>
                        ${dataFormatada(
                            deposito.criadoEm
                        )}
                    </td>


                    <td>

                        <span class="status ${classe}">
                            ${textoStatus}
                        </span>

                    </td>


                    <td>

                        <div class="acoes">

                            ${
                                podeAgir
                                ? `
                                    <button
                                        class="btn btn-aprovar"
                                        data-acao="aprovar"
                                        data-id="${escapar(deposito.id)}"
                                    >
                                        Aprovar
                                    </button>

                                    <button
                                        class="btn btn-rejeitar"
                                        data-acao="rejeitar"
                                        data-id="${escapar(deposito.id)}"
                                    >
                                        Rejeitar
                                    </button>
                                `
                                : `
                                    <span>
                                        —
                                    </span>
                                `
                            }

                        </div>

                    </td>

                </tr>

            `;

        });


        html += `

                </tbody>

            </table>

        `;


        conteudo.innerHTML = html;


        document
            .querySelectorAll("[data-acao]")
            .forEach((botao) => {

                botao.addEventListener(
                    "click",
                    () => {

                        const acao =
                            botao.dataset.acao;

                        const id =
                            botao.dataset.id;


                        if (acao === "aprovar") {

                            aprovarDeposito(id);

                        }


                        if (acao === "rejeitar") {

                            rejeitarDeposito(id);

                        }

                    }
                );

            });

    }


    // ==========================================
    // APROVAR
    // ==========================================

    async function aprovarDeposito(id) {

        const deposito =
            depositos.find(
                item => item.id === id
            );


        if (!deposito) {
            return;
        }


        /*
         * IMPORTANTE:
         *
         * Nesta etapa NÃO alteramos saldo.
         *
         * A função apenas informa que a aprovação
         * financeira será implementada na próxima
         * etapa com proteção contra duplicidade.
         */


        alert(
            "A solicitação foi selecionada para aprovação.\n\n" +
            "A atualização do saldo será implementada na próxima etapa."
        );

    }


    // ==========================================
    // REJEITAR
    // ==========================================

    async function rejeitarDeposito(id) {

        const deposito =
            depositos.find(
                item => item.id === id
            );


        if (!deposito) {
            return;
        }


        alert(
            "A solicitação foi selecionada para rejeição.\n\n" +
            "A gravação definitiva do status será implementada junto com o fluxo financeiro."
        );

    }


    // ==========================================
    // PESQUISA
    // ==========================================

    busca.addEventListener(
        "input",
        renderizar
    );


    filtroStatus.addEventListener(
        "change",
        renderizar
    );


    // ==========================================
    // VOLTAR
    // ==========================================

    document
        .getElementById("btnVoltar")
        .addEventListener(
            "click",
            () => {

                window.location.href =
                    "./index.html";

            }
        );


    // ==========================================
    // AUTENTICAÇÃO
    // ==========================================

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                window.location.href =
                    "../index.html";

                return;

            }


            try {

                masterAutorizado =
                    await verificarMaster(user);


                if (!masterAutorizado) {

                    await auth.signOut();

                    window.location.href =
                        "../index.html";

                    return;

                }


                await carregarUsuarios();

                await carregarDepositos();


            } catch (erro) {

                console.error(
                    "Erro na página de depósitos:",
                    erro
                );


                conteudo.innerHTML = `
                    <div class="erro">
                        Não foi possível carregar os depósitos.
                    </div>
                `;

            }

        }
    );

</script>

</body>
</html>
