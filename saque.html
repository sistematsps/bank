<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Solicitar Saque</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .topo {
            background: #111827;
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .topo h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .topo p {
            color: #d1d5db;
            font-size: 14px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .saldo-box {
            background: #ecfdf5;
            border: 1px solid #a7f3d0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .saldo-label {
            color: #065f46;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .saldo {
            color: #047857;
            font-size: 30px;
            font-weight: bold;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-saque {
            background: #2563eb;
            color: white;
        }

        .btn-saque:hover {
            background: #1d4ed8;
        }

        .btn-voltar {
            background: #e5e7eb;
            color: #111827;
        }

        .btn-voltar:hover {
            background: #d1d5db;
        }

        .mensagem {
            display: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .mensagem.sucesso {
            display: block;
            background: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

        .mensagem.erro {
            display: block;
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .titulo-historico {
            margin-bottom: 15px;
            font-size: 20px;
            color: #111827;
        }

        .saque-item {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            background: #fafafa;
        }

        .saque-linha {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }

        .saque-label {
            color: #6b7280;
            font-size: 13px;
        }

        .saque-valor {
            font-size: 18px;
            font-weight: bold;
            color: #111827;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-pendente {
            background: #fef3c7;
            color: #92400e;
        }

        .status-aprovado {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejeitado {
            background: #fee2e2;
            color: #991b1b;
        }

        .vazio {
            text-align: center;
            color: #6b7280;
            padding: 20px 0;
        }

        .info-whatsapp {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            color: #6b7280;
            padding: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .topo h1 {
                font-size: 21px;
            }

            .saldo {
                font-size: 26px;
            }

            .card {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topo">
        <h1>💸 Solicitar Saque</h1>
        <p>Solicite seu saque e acompanhe o andamento da solicitação.</p>
    </div>

    <div class="card">

        <div id="mensagem" class="mensagem"></div>

        <div class="saldo-box">
            <div class="saldo-label">Saldo disponível</div>
            <div id="saldo" class="saldo">R$ 0,00</div>
        </div>

        <label for="valor">Valor do saque</label>

        <input
            type="number"
            id="valor"
            min="0.01"
            step="0.01"
            placeholder="Digite o valor"
        >

        <button
            id="btnSaque"
            class="btn btn-saque"
        >
            Solicitar Saque
        </button>

        <div class="info-whatsapp">
            📱 Após registrar a solicitação, o WhatsApp será aberto
            automaticamente para enviar os dados do saque ao responsável.
        </div>

        <button
            class="btn btn-voltar"
            onclick="window.location.href='dashboard.html'"
        >
            ← Voltar para o Dashboard
        </button>

    </div>

    <div class="card">

        <h2 class="titulo-historico">📋 Histórico de Saques</h2>

        <div id="historico">
            <div class="loading">
                Carregando histórico...
            </div>
        </div>

    </div>

</div>


<script type="module">

    import { auth, db } from "./js/firebase.js";

    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
        collection,
        query,
        where,
        orderBy,
        getDocs,
        doc,
        getDoc,
        addDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // =========================================================
    // CONFIGURAÇÃO
    // =========================================================

    const NUMERO_WHATSAPP = "5588982355586";


    // =========================================================
    // ELEMENTOS
    // =========================================================

    const saldoElemento = document.getElementById("saldo");
    const valorInput = document.getElementById("valor");
    const btnSaque = document.getElementById("btnSaque");
    const mensagemElemento = document.getElementById("mensagem");
    const historicoElemento = document.getElementById("historico");


    // =========================================================
    // VARIÁVEIS
    // =========================================================

    let usuarioAtual = null;
    let dadosUsuario = null;
    let saldoAtual = 0;


    // =========================================================
    // FORMATAÇÃO
    // =========================================================

    function formatarMoeda(valor) {

        return Number(valor || 0).toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });

    }


    function formatarData(timestamp) {

        if (!timestamp) {
            return "Data não disponível";
        }

        try {

            const data = timestamp.toDate();

            return data.toLocaleString("pt-BR");

        } catch (erro) {

            return "Data não disponível";

        }

    }


    // =========================================================
    // MENSAGEM
    // =========================================================

    function mostrarMensagem(texto, tipo) {

        mensagemElemento.textContent = texto;

        mensagemElemento.className = "mensagem " + tipo;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function limparMensagem() {

        mensagemElemento.textContent = "";

        mensagemElemento.className = "mensagem";

    }


    // =========================================================
    // CARREGAR DADOS DO USUÁRIO
    // =========================================================

    async function carregarUsuario() {

        const usuarioRef = doc(
            db,
            "usuarios",
            usuarioAtual.uid
        );

        const usuarioSnap = await getDoc(usuarioRef);

        if (usuarioSnap.exists()) {

            dadosUsuario = usuarioSnap.data();

        } else {

            dadosUsuario = {
                nome: usuarioAtual.displayName || "Usuário",
                email: usuarioAtual.email || "",
                telefone: ""
            };

        }

    }


    // =========================================================
    // CARREGAR CONTA
    // =========================================================

    async function carregarConta() {

        const contaRef = doc(
            db,
            "contas",
            usuarioAtual.uid
        );

        const contaSnap = await getDoc(contaRef);

        if (!contaSnap.exists()) {

            throw new Error(
                "Conta financeira não encontrada."
            );

        }

        const conta = contaSnap.data();

        saldoAtual = Number(conta.saldo || 0);

        saldoElemento.textContent =
            formatarMoeda(saldoAtual);

    }


    // =========================================================
    // CARREGAR HISTÓRICO
    // =========================================================

    async function carregarHistorico() {

        historicoElemento.innerHTML =
            '<div class="loading">Carregando histórico...</div>';

        try {

            const q = query(
                collection(db, "saques"),
                where(
                    "usuarioId",
                    "==",
                    usuarioAtual.uid
                ),
                orderBy(
                    "criadoEm",
                    "desc"
                )
            );

            const snapshot = await getDocs(q);

            if (snapshot.empty) {

                historicoElemento.innerHTML = `
                    <div class="vazio">
                        Nenhuma solicitação de saque encontrada.
                    </div>
                `;

                return;

            }

            historicoElemento.innerHTML = "";

            snapshot.forEach((docSnap) => {

                const saque = docSnap.data();

                let classeStatus = "status-pendente";
                let textoStatus = "Pendente";

                if (saque.status === "aprovado") {

                    classeStatus = "status-aprovado";
                    textoStatus = "Aprovado";

                }

                if (saque.status === "rejeitado") {

                    classeStatus = "status-rejeitado";
                    textoStatus = "Rejeitado";

                }

                const item = document.createElement("div");

                item.className = "saque-item";

                item.innerHTML = `

                    <div class="saque-linha">

                        <span class="saque-label">
                            Valor
                        </span>

                        <span class="saque-valor">
                            ${formatarMoeda(saque.valor)}
                        </span>

                    </div>

                    <div class="saque-linha">

                        <span class="saque-label">
                            Data
                        </span>

                        <span>
                            ${formatarData(saque.criadoEm)}
                        </span>

                    </div>

                    <div class="saque-linha">

                        <span class="saque-label">
                            Status
                        </span>

                        <span class="status ${classeStatus}">
                            ${textoStatus}
                        </span>

                    </div>

                    <div class="saque-linha">

                        <span class="saque-label">
                            Solicitação
                        </span>

                        <span style="font-size:12px;">
                            ${docSnap.id}
                        </span>

                    </div>

                `;

                historicoElemento.appendChild(item);

            });

        } catch (erro) {

            console.error(
                "Erro ao carregar histórico:",
                erro
            );

            historicoElemento.innerHTML = `
                <div class="vazio">
                    Não foi possível carregar o histórico.
                </div>
            `;

        }

    }


    // =========================================================
    // GERAR MENSAGEM WHATSAPP
    // =========================================================

    function gerarMensagemWhatsApp(
        idSaque,
        valor,
        dataSolicitacao
    ) {

        const nome =
            dadosUsuario?.nome ||
            usuarioAtual.displayName ||
            "Não informado";

        const email =
            dadosUsuario?.email ||
            usuarioAtual.email ||
            "Não informado";

        const telefone =
            dadosUsuario?.telefone ||
            "Não informado";

        const mensagem =

`💸 SOLICITAÇÃO DE SAQUE

━━━━━━━━━━━━━━━━━━━━

👤 CLIENTE
Nome: ${nome}
E-mail: ${email}
Telefone: ${telefone}

━━━━━━━━━━━━━━━━━━━━

💰 DADOS DO SAQUE

Valor solicitado: ${formatarMoeda(valor)}

ID da solicitação:
${idSaque}

Data da solicitação:
${dataSolicitacao}

Status:
PENDENTE

━━━━━━━━━━━━━━━━━━━━

📌 Solicitação registrada na plataforma.

Aguardando análise e processamento pelo responsável.

━━━━━━━━━━━━━━━━━━━━

Sistema de Carteira - Estudo`;

        return mensagem;

    }


    // =========================================================
    // SOLICITAR SAQUE
    // =========================================================

    btnSaque.addEventListener(
        "click",
        async () => {

            limparMensagem();

            const valor = Number(
                valorInput.value
            );

            // -------------------------------------------------
            // VALIDAÇÃO
            // -------------------------------------------------

            if (!valor || valor <= 0) {

                mostrarMensagem(
                    "Digite um valor de saque válido.",
                    "erro"
                );

                return;

            }


            if (valor > saldoAtual) {

                mostrarMensagem(
                    "O valor solicitado é maior que seu saldo disponível.",
                    "erro"
                );

                return;

            }


            // -------------------------------------------------
            // CONFIRMAÇÃO
            // -------------------------------------------------

            const confirmar = confirm(

                `Confirma a solicitação de saque de ${formatarMoeda(valor)}?`

            );

            if (!confirmar) {

                return;

            }


            // -------------------------------------------------
            // ABRIR JANELA PARA EVITAR BLOQUEIO DO NAVEGADOR
            // -------------------------------------------------

            let whatsappWindow = null;

            try {

                whatsappWindow = window.open(
                    "about:blank",
                    "_blank"
                );

            } catch (erro) {

                whatsappWindow = null;

            }


            // -------------------------------------------------
            // DESABILITAR BOTÃO
            // -------------------------------------------------

            btnSaque.disabled = true;

            btnSaque.textContent =
                "Registrando solicitação...";


            try {

                // -------------------------------------------------
                // RECARREGAR SALDO DIRETAMENTE DO FIRESTORE
                // -------------------------------------------------

                const contaRef = doc(
                    db,
                    "contas",
                    usuarioAtual.uid
                );

                const contaSnap =
                    await getDoc(contaRef);


                if (!contaSnap.exists()) {

                    throw new Error(
                        "Conta não encontrada."
                    );

                }


                const contaAtual =
                    contaSnap.data();

                const saldoVerificado =
                    Number(contaAtual.saldo || 0);


                // -------------------------------------------------
                // VERIFICAR NOVAMENTE O SALDO
                // -------------------------------------------------

                if (valor > saldoVerificado) {

                    throw new Error(
                        "O saldo disponível mudou. Atualize a página e tente novamente."
                    );

                }


                // -------------------------------------------------
                // CRIAR SOLICITAÇÃO
                // -------------------------------------------------

                const saqueCriado = await addDoc(

                    collection(
                        db,
                        "saques"
                    ),

                    {
                        usuarioId:
                            usuarioAtual.uid,

                        valor:
                            Number(
                                valor.toFixed(2)
                            ),

                        status:
                            "pendente",

                        criadoEm:
                            serverTimestamp(),

                        atualizadoEm:
                            serverTimestamp()
                    }

                );


                // -------------------------------------------------
                // ID DO SAQUE
                // -------------------------------------------------

                const idSaque =
                    saqueCriado.id;


                // -------------------------------------------------
                // DATA PARA WHATSAPP
                // -------------------------------------------------

                const dataAtual =
                    new Date().toLocaleString(
                        "pt-BR"
                    );


                // -------------------------------------------------
                // MONTAR MENSAGEM
                // -------------------------------------------------

                const mensagem =
                    gerarMensagemWhatsApp(
                        idSaque,
                        valor,
                        dataAtual
                    );


                // -------------------------------------------------
                // URL DO WHATSAPP
                // -------------------------------------------------

                const urlWhatsApp =
                    "https://wa.me/" +
                    NUMERO_WHATSAPP +
                    "?text=" +
                    encodeURIComponent(
                        mensagem
                    );


                // -------------------------------------------------
                // ATUALIZAR INTERFACE
                // -------------------------------------------------

                mostrarMensagem(
                    "Solicitação registrada com sucesso! O WhatsApp será aberto para enviar os dados.",
                    "sucesso"
                );


                valorInput.value = "";


                // -------------------------------------------------
                // ATUALIZAR SALDO EXIBIDO
                // -------------------------------------------------

                saldoAtual =
                    saldoVerificado;

                saldoElemento.textContent =
                    formatarMoeda(
                        saldoAtual
                    );


                // -------------------------------------------------
                // ATUALIZAR HISTÓRICO
                // -------------------------------------------------

                await carregarHistorico();


                // -------------------------------------------------
                // ABRIR WHATSAPP
                // -------------------------------------------------

                if (whatsappWindow) {

                    whatsappWindow.location.href =
                        urlWhatsApp;

                } else {

                    window.location.href =
                        urlWhatsApp;

                }


            } catch (erro) {

                console.error(
                    "Erro ao solicitar saque:",
                    erro
                );


                // Fecha a janela em branco
                // caso alguma coisa tenha dado errado

                if (
                    whatsappWindow &&
                    !whatsappWindow.closed
                ) {

                    whatsappWindow.close();

                }


                mostrarMensagem(
                    erro.message ||
                    "Não foi possível registrar a solicitação de saque.",
                    "erro"
                );


            } finally {

                btnSaque.disabled = false;

                btnSaque.textContent =
                    "Solicitar Saque";

            }

        }
    );


    // =========================================================
    // AUTENTICAÇÃO
    // =========================================================

    onAuthStateChanged(
        auth,
        async (usuario) => {

            if (!usuario) {

                window.location.href =
                    "index.html";

                return;

            }

            usuarioAtual = usuario;

            try {

                await carregarUsuario();

                await carregarConta();

                await carregarHistorico();

            } catch (erro) {

                console.error(
                    "Erro ao carregar página:",
                    erro
                );

                mostrarMensagem(
                    erro.message ||
                    "Erro ao carregar os dados da conta.",
                    "erro"
                );

            }

        }
    );

</script>

</body>
</html>
